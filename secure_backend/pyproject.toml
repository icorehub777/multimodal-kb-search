[project]
name = "kbsearch-backend"
version = "0.1.0"
description = "KBSearch protected vector search API."
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.en.md"
dependencies = [
    "python-dotenv==1.2.2",
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "qdrant-client==1.18.0",
    "dashscope==1.25.19",
    "Pillow==12.2.0",
]

[project.optional-dependencies]
dev = ["httpx2==2.13.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kbsearch_backend*"]
