[project]
name = "kbsearch-cli"
version = "0.1.0"
description = "KBSearch command line interface for Agent-driven queries."
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.en.md"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "PyMuPDF>=1.24",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "streamlit>=1.36,<2",
]

[project.scripts]
kbsearch = "kbsearch_cli.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
