services:
  importer:
    image: kbsearch-importer
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./work:/app/work
    restart: "no"
    networks:
      - kbsearch

networks:
  kbsearch:
    name: kbsearch
    external: true
