[project]
name = "kbsearch-importer"
version = "0.1.0"
description = "KBSearch Google Workspace import and synchronization tools."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "requests>=2.31",
    "qdrant-client>=1.9",
    "dashscope>=1.20",
    "PyMuPDF>=1.24",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.scripts]
kbsearch-importer = "kbsearch_importer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
