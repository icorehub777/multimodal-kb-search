name: kbsearch-secure-backend

services:
  secure-backend:
    image: kbsearch-secure-backend
    container_name: kbsearch-secure-backend
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      kbsearch:
        aliases:
          - secure-backend

networks:
  kbsearch:
    name: kbsearch
    external: true
