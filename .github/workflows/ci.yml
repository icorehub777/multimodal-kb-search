name: Basic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONNOUSERSITE: "1"

jobs:
  offline-tests:
    name: ${{ matrix.project }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: importer
            os: ubuntu-24.04
          - project: secure_backend
            os: ubuntu-24.04
          - project: query_cli
            os: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install importer
        if: matrix.project == 'importer'
        run: python -m pip install -e ./importer
      - name: Install package and development dependencies
        if: matrix.project != 'importer'
        run: python -m pip install -e "./${{ matrix.project }}[dev]"
      - name: Prepare CJK test font
        if: matrix.project != 'secure_backend'
        run: |
          $fontPath = Join-Path $env:RUNNER_TEMP 'NotoSansTC-VF.ttf'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/Variable/TTF/Subset/NotoSansTC-VF.ttf' -OutFile $fontPath
          if ((Get-FileHash $fontPath -Algorithm SHA256).Hash -ne 'AC091CC8CD19E848202AFC8FE6D3809B4526C8FDBDB4BE82DA20C4F785949591') {
              throw 'CJK test font checksum mismatch.'
          }
          "KBSEARCH_CJK_FONT_PATH=$fontPath" >> $env:GITHUB_ENV
      - name: Run offline tests
        shell: python
        run: |
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/${{ matrix.project }}", pattern="test_*.py", top_level_dir="."
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun == 0 or result.skipped:
              sys.exit("CI requires non-empty tests with no skipped cases.")
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Build CLI wheel
        if: matrix.project == 'query_cli'
        run: python -m build query_cli --wheel --outdir "$env:RUNNER_TEMP/wheel"
      - name: Install wheel into a clean environment
        if: matrix.project == 'query_cli'
        run: |
          $wheelEnv = Join-Path $env:RUNNER_TEMP 'cli-wheel-env'
          python -m venv $wheelEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem "$env:RUNNER_TEMP/wheel/*.whl")
          if ($wheels.Count -ne 1) { throw 'Expected exactly one CLI wheel.' }
          & "$wheelEnv/Scripts/python.exe" -m pip install $wheels[0].FullName
      - name: Check installed wheel and command help
        if: matrix.project == 'query_cli'
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          workdir = Path(os.environ["RUNNER_TEMP"])
          environment = workdir / "cli-wheel-env"
          python = environment / "Scripts" / "python.exe"
          command = environment / "Scripts" / "kbsearch.exe"
          check = """
          import importlib.metadata
          import sys
          from pathlib import Path
          import kbsearch_cli

          package = Path(kbsearch_cli.__file__).resolve()
          assert package.is_relative_to(Path(sys.prefix).resolve()), package
          assert package.with_name('viewer_app.py').is_file()
          distribution = importlib.metadata.distribution('kbsearch-cli')
          assert set(distribution.metadata['Requires-Python'].split(',')) == {'>=3.12', '<3.13'}
          assert distribution.metadata['License-Expression'] == 'AGPL-3.0-only'
          assert any(str(item).endswith('.dist-info/licenses/LICENSE')
                     and distribution.locate_file(item).is_file()
                     for item in distribution.files)
          """
          subprocess.run([str(python), "-I", "-c", check], cwd=workdir, check=True, timeout=30)
          for arguments in ([], ["login"], ["query"], ["render-pdf-pages"], ["view-results"]):
              subprocess.run([str(command), *arguments, "--help"], cwd=workdir, check=True, timeout=30)
